<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر الملابس</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600&display=swap" rel="stylesheet">
</head>

<body class="bg-gray-100 text-gray-600">
    <header class="bg-white shadow-md">
        <nav class="container mx-auto p-4 flex justify-between items-center">
            <a href="#" class="text-3xl font-bold">متجر الملابس</a>
            <button class="lg:block hidden text-gray-600 hover:text-gray-900">Dark Mode</button>
        </nav>
    </header>

    <!-- Hero -->
    <section class="bg-cover h-screen bg-no-repeat" style="background-image: url('https://picsum.photos/2000/1000')">
        <div class="container mx-auto p-4 flex justify-center items-center h-screen">
            <h1 class="text-5xl font-bold text-white">متجر الملابس</h1>
        </div>
    </section>

    <!-- Services -->
    <section class="bg-white py-4">
        <div class="container mx-auto p-4 flex flex-wrap justify-center items-center">
            <div class="w-full sm:w-1/2 md:w-1/3 xl:w-1/3 p-4">
                <i class="fa fa-shipping-fast fa-3x text-blue-500"></i>
                <h3 class="text-lg font-bold text-gray-600 mb-2">توصيل سريع</h3>
                <p class="text-gray-600">نحن نضمن أن يتم توصيل المنتجات في أسرع وقت ممكن.</p>
            </div>
            <div class="w-full sm:w-1/2 md:w-1/3 xl:w-1/3 p-4">
                <i class="fa fa-support fa-3x text-green-500"></i>
                <h3 class="text-lg font-bold text-gray-600 mb-2">دعم ممتاز</h3>
                <p class="text-gray-600">نحن نضمن أن يتم تلبية احتياجاتك في أسرع وقت ممكن.</p>
            </div>
            <div class="w-full sm:w-1/2 md:w-1/3 xl:w-1/3 p-4">
                <i class="fa fa-lock fa-3x text-red-500"></i>
                <h3 class="text-lg font-bold text-gray-600 mb-2">امن وثقة</h3>
                <p class="text-gray-600">نحن نضمن أن تكون Transactionsك آمنة ومضمونة.</p>
            </div>
        </div>
    </section>

    <!-- Contact -->
    <section class="bg-white py-4">
        <div class="container mx-auto p-4">
            <h2 class="text-2xl font-bold text-gray-600 mb-4">اتصل بنا</h2>
            <form class="flex flex-wrap justify-center items-center">
                <input type="text" class="w-full sm:w-1/2 md:w-1/3 xl:w-1/3 border border-gray-300 py-2 px-4 mb-4" placeholder="الإسم">
                <input type="email" class="w-full sm:w-1/2 md:w-1/3 xl:w-1/3 border border-gray-300 py-2 px-4 mb-4" placeholder="البريد الالكتروني">
                <input type="text" class="w-full sm:w-1/2 md:w-1/3 xl:w-1/3 border border-gray-300 py-2 px-4 mb-4" placeholder="رقم التليفون">
                <textarea class="w-full border border-gray-300 py-2 px-4 mb-4" rows="4" placeholder="الرسالة"></textarea>
                <button class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">إرسال</button>
            </form>
        </div>
    </section>

    <!--.Footer -->
    <footer class="bg-gray-800 text-white p-4">
        <div class="container mx-auto text-center">
            <p>صُنع بذكاء بواسطة براندو</p>
        </div>
    </footer>
</body>
</html>
